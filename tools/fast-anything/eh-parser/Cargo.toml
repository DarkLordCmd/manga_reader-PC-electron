[package]
name = "eh-parser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "eh_parser"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1"
scraper = "0.24"
url = "2"
regex = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = false

# Отдельный крейт, даже внутри другого Cargo workspace.
[workspace]
