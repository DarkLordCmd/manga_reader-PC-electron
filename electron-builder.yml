appId: dev.mangareader.electron
productName: Manga Reader
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
win:
  target:
    - nsis
    - portable
  # Tor expert bundle is downloaded Windows-only (scripts/fetch-tor.mjs,
  # verified against torproject sha256sums-signed-build.txt). Bundling it on
  # non-Windows targets would ship the wrong platform's binaries, so it stays
  # win-scoped.
  extraResources:
    - from: vendor/tor
      to: tor
      filter: ['**/*']
mac:
  target: dmg
  category: public.app-category.entertainment
  # Requires a signed Dev ID cert (see README "Code signing").
linux:
  target:
    - AppImage
    - deb
  category: Graphics
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: DarkLordCmd
  repo: manga_reader-PC-electron
  private: false
