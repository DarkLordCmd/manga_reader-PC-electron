appId: dev.mangareader.electron
productName: Manga Reader
directories:
  output: dist
  buildResources: build
afterPack: scripts/apply-fuses.cjs
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
win:
  target:
    - nsis
    - portable
  # Tor expert bundle is downloaded Windows-only (scripts/fetch-tor.mjs,
  # verified against torproject sha256sums-signed-build.txt). Bundling it on
  # non-Windows targets would ship the wrong platform's binaries, so it stays
  # win-scoped.
  extraResources:
    - from: vendor/tor
      to: tor
      # The source .tar.gz (22 MB), the upstream licence/readme text files and
      # the version stamp are build-time artefacts — shipping them only bloated
      # the installer. Binaries + geoip + torrc-defaults/pt_config stay.
      filter:
        - '**/*'
        - '!**/*.tar.gz'
        - '!**/*.txt'
        - '!**/*.md'
        - '!**/.tor-version'
        # Not used by the embedded daemon: launchTor() passes its own flags and
        # never reads torrc-defaults/pt_config, the app never calls tor-gencert,
        # conjure bridges are not offered in the UI, and tor resolves geoip
        # relative to CWD so it runs without them (verified in main.log).
        - '!**/conjure-client.exe'
        - '!**/tor-gencert.exe'
        - '!**/geoip'
        - '!**/geoip6'
        - '!**/torrc-defaults'
        - '!**/pt_config.json'
mac:
  target: dmg
  category: public.app-category.entertainment
  # Requires a signed Dev ID cert (see README "Code signing").
  extraResources:
    - from: vendor/tor
      to: tor
      filter: ['**/*']
linux:
  target:
    - AppImage
    - deb
  category: Graphics
  extraResources:
    - from: vendor/tor
      to: tor
      filter: ['**/*']
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: DarkLordCmd
  repo: manga_reader-PC-electron
  private: false
