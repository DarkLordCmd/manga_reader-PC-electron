appId: dev.mangareader.electron
productName: Manga Reader
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: vendor/tor
    to: tor
    filter: ['**/*']
win:
  target:
    - nsis
    - portable
mac:
  target: dmg
  category: public.app-category.entertainment
linux:
  target:
    - AppImage
    - deb
  category: Graphics
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
